services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      - ./backend:/app
      - /home/os-sunnie.gd.weng/python_workstation/side-project/RAG/RAG_full_tech_overview/papers:/app/papers

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "8081:8080"
    environment:
      - OLLAMA_BASE_URL=http://backend:8000/v1
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    # Note: Using temporary storage - data will be lost when container stops
    # For production, use external Qdrant service or configure persistent volumes
